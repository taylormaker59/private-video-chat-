
<h1>Private Video Chat</h1>

<form id="signupForm" style="max-width:400px;margin:auto;text-align:left">

  <label>Email</label><br>
  <input type="email" required style="width:100%;padding:10px"><br><br>

  <label>Country</label><br>
  <select required style="width:100%;padding:10px">
    <option value="">Select country</option>
    <option>Japan</option>
    <option>South Korea</option>
    <option>Philippines</option>
    <option>Thailand</option>
    <option>Vietnam</option>
    <option>Other</option>
  </select><br><br>

  <label>
    <input type="checkbox" required>
    I confirm I am 18 years or older
  </label><br><br>

  <button type="submit" style="padding:12px;width:100%;font-size:16px">
    Apply for Access
  </button>

</form>

<p id="message" style="margin-top:20px;color:lightgreen"></p>

<script>
document.getElementById("signupForm").onsubmit = function(e) {
  e.preventDefault();
  document.getElementById("message").innerText =
    "Application submitted. Await approval.";
};
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC10VMtKw1jCoqgnJQIBD42bCy9kdeN_vk",
  authDomain: "private-video-chat.firebaseapp.com",
  projectId: "private-video-chat",
  storageBucket: "private-video-chat.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("signupForm").onsubmit = async function(e) {
  e.preventDefault();

  const email = document.querySelector("input[type=email]").value;
  const country = document.querySelector("select").value;

  await addDoc(collection(db, "applications"), {
    email,
    country,
    status: "pending",
    isAdult: true,
    created: new Date()
  });

  document.getElementById("message").innerText =
    "Application submitted. Await approval.";
};
</script>
